source = ~/.config/hypr/monitors.conf

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

#
# Include additional settings
#
source = ~/.config/hypr/includes.conf

xwayland {
    force_zero_scaling = true
}

# WINDOW DECORATION
decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # slightly larger rounding for softer corners
    rounding = 14
    # subtle background blur for a cleaner look
    blur {
        enabled = true
        size = 9
        passes = 3
        ignore_opacity = true
        xray = false
        new_optimizations = true
    }

    # inactive_opacity = 0.95
    # active_opacity = 0.9

    shadow {
        enabled = true
        range = 10
        render_power = 3
        sharp = false
    }

    dim_inactive = false
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsIn, 1, 7, myBezier, slide
    animation = windowsOut, 1, 7, myBezier, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, myBezier, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

gestures {
    # workspace_swipe = false
}

# Ignore maximize requests
windowrulev2 = suppressevent maximize, class:.*

# Remove the right-click menu blurring in Chromium browsers
windowrulev2 = noblur, class:^()$, title:^()$

# Remove the weird pop-up behavior in VSCode
#windowrulev2 = stayfocused, class:^(codium)$
windowrule = minsize 1 1, class:^(codium)$

# Don't inform about updates 
ecosystem:no_update_news = true

# Blur Waybar
layerrule = blur, waybar
layerrule = ignorezero, waybar
#layerrule = ignorealpha 0.5, waybar

# Make file picker windows floating
windowrulev2 = float, center, title:^(Open File|Open|Save|Save As|Export|Import|Choose File), class:^(.*)$
windowrulev2 = float, center, class:(xdg-desktop-portal-gtk)
windowrulev2 = noborder, class:(Xdg-desktop-portal-gtk)
# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrule = float,title:^(galculator|org.gnome.Calculator|azote)$
windowrule = idleinhibit fullscreen,class:^.*$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# KEY BINDINGS, see https://wiki.hyprland.org/Configuring/Binds/ for more
# If you happen to change some key bindings, you may also edit ~/.local/share/nwg-shell-config/help-hyprland.pango

# We've defined $term, $editor and so on in includes.conf.
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $editor
bind = $mainMod, X, exec, $exit
bind = $mainMod, F, exec, $filemanager
bind = ALT, F1, exec, $launcher
bind = $mainMod, T, exec, $term
bind = $mainMod, F2, exec, $term

bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, I, pin
bind = $mainMod, C, killactive,
bind = ALT, Q, killactive,
bind = $mainMod, Q, killactive,  # restore Mod+q to close focused window
bind = ALT, F4, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, Space, togglefloating,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, C, exec, hyprctl reload      # reload Hyprland
bind = $mainMod SHIFT, Z, movetoworkspace, special  # move to the special workspace
bind = $mainMod, Z, togglespecialworkspace          # show/hide special workspace

# Toggle maximize (keep gaps / bars) — Mod+M
bind = $mainMod, M, fullscreen, 1

bind = ALT, Tab, togglesplit,                       # (dwindle)
bind = $mainMod, Tab, workspace, previous           # toggle last-used workspace
bind = $mainMod, P, pseudo,                         # (dwindle)
bind = $mainMod, A, layoutmsg, cycleprev            # (master)
bind = $mainMod, S, layoutmsg, swapwithmaster       # (master)
bind = $mainMod, D, layoutmsg, cyclenext            # (master)

# SCREENSHOT — use grim/slurp wrapper
# Print: full capture (whole compositor) saved to Pictures/Screenshots
bind = , Print, exec, /home/kk/.config/hypr/scripts full
# Ctrl+Print: capture monitor of the focused window (display)
bind = CONTROL, Print, exec, /home/kk/.config/hypr/scripts display
# Mod+Shift+Ctrl+Print: capture currently focused window
bind = $mainMod SHIFT+CONTROL, Print, exec, /home/kk/.config/hypr/scripts focused
# Shift+Ctrl+Print: selection -> opens swappy for annotation
bind = SHIFT+CONTROL, Print, exec, /home/kk/.config/hypr/scripts swappy

# MOVE FOCUS with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# MOVE WINDOW with mainMod SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# SWITCH WORKSPACES with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# MOVE ACTIVE WINDOW TO A WORKSPACE with mainMod + SHIFT + [0-9]
# Use an exec wrapper: move the active window, then immediately switch back
# to the previous workspace so the user's last-workspace toggle (Mod+Tab)
# continues to work as expected.
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/move_and_follow.sh 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/move_and_follow.sh 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/move_and_follow.sh 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/move_and_follow.sh 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/move_and_follow.sh 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/move_and_follow.sh 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/move_and_follow.sh 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/move_and_follow.sh 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/move_and_follow.sh 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/move_and_follow.sh 10

# SCROLL THROUGH EXISTING WORKSPACES with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# MOVE/RESIZE WINDOWS with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# KEY BINDINGS SUBMAP TO RESIZE WINDOWS WITH ARROW KEYS
# switch to a submap called resize
bind = $mainMod, R, submap, resize

# start a submap called "resize"
submap = resize

# set repeatable binds for resizing the active window
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10

# use reset to go back to the global submap
bind = , escape, submap, reset

# will reset the submap, which will return to the global submap
submap = reset

#exec-once = sh -c 'hyprpaper --wallpaper "/home/kk/Pictures/kian-lem-xsGDJzhESVo-unsplash.jpg" fill || swaybg -i "/home/kk/Pictures/kian-lem-xsGDJzhESVo-unsplash.jpg" -m fill &'

exec-once = sh -c 'mpvpaper -f -p -o "no-audio loop" ALL /home/kk/Videos/Hidamari/extraordinary-black-hole.3840x2160.mp4'

exec-once = dunst
# Waybar: start a single instance from Hyprland itself (don’t spawn via background shell)
exec-once = /home/kk/.config/hypr/start_waybar.sh
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets,ssh,pkcs11
# exec-once = sh -c '~/.config/nwg-dock/sync-favorites.sh'

# Autostart nwg-dock-hyprland (attempt Wayland backend). Dock will fallback to floating rule below if needed.
# exec-once = nwg-dock-hyprland -x -p "left" -i 48
# Autostart hypr-dock
# exec-once = hypr-dock
# Toggle hypr-dock
# bind = $mainMod, x, exec, sh -c "pkill -x hypr-dock || hypr-dock"

# Launch terminal (sway used $term = ghostty)
bind = $mainMod, Return, exec, /usr/bin/ghostty

# Launch application launcher (wofi)
bind = $mainMod, d, exec, wofi --show=drun

# Gammastep toggle
bind = $mainMod SHIFT, T, exec, /home/kk/.config/sway/gammastep_toggle.sh

# App switcher (sway used Mod+Shift+Tab)
bind = $mainMod SHIFT, Tab, exec, /home/kk/.config/sway/app_switcher.sh

# DPMS: power off/on monitors
# Mod+Shift+O -> turn DPMS off (power off monitors)
bind = $mainMod SHIFT, O, exec, sh -c 'sleep 0.05 && hyprctl dispatch dpms off'
# Mod+Shift+P -> turn DPMS on (power on monitors)
bind = $mainMod SHIFT, P, exec, sh -c 'sleep 0.05 && hyprctl dispatch dpms on'

# Workspace rules translated from sway for automatic window placement
# (Note: windowrule syntax uses regex; verify class/app_id values when necessary)
windowrule = workspace 3, xdgtag:^floorp$
windowrule = workspace 3, class:^floorp$
windowrule = workspace 5, class:^Code$
windowrule = workspace 1, class:^Brave-browser$
windowrule = workspace 9, class:^Ferdium$
windowrule = workspace 10, class:^firefox$
windowrule = workspace 10, xdgtag:^com.github.wwmm.easyeffects$


